      - name: Generate Custom Vivo Files
        run: |
          mkdir -p app/src/main/java/com/vivo/funtouch/shortcutcenter
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          # 1. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=false
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VivoShortcutCenter"
          include ':app'
          EOF

          # 3. root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.22' apply false
          }
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.vivo.funtouch.shortcutcenter'
              compileSdk 33
              defaultConfig {
                  applicationId "com.myvivo.s1pro.shortcutcenter"
                  minSdk 26
                  targetSdk 33
                  versionCode 11
                  versionName "11.0_CustomTilesFixed"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
          }
          EOF

          # 5. styles.xml
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.VivoFuntouch" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:colorBackgroundCacheHint">@null</item>
                  <item name="android:windowIsTranslucent">true</item>
              </style>
          </resources>
          EOF

          # 6. Drawables
          cat << 'EOF' > app/src/main/res/drawable/bg_panel_blur.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#F923252B" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_service_card.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#21232B" />
              <corners android:radius="14dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_circle_toggle_inactive.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#2B2D38" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_circle_toggle_active.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#4D6EF5" />
          </shape>
          EOF

