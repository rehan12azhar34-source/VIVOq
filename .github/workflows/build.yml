          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/CustomTilesActivity.kt
          package com.vivo.funtouch.shortcutcenter
          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView

          class CustomTilesActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_custom)
                  val all = TileRegistry.loadSavedTiles(this)
                  val rvAct = findViewById<RecyclerView>(R.id.rvCustomActive)
                  val rvAvail = findViewById<RecyclerView>(R.id.rvCustomAvailable)
                  val actList = all.filter { it.isDisplayed }.toMutableList()
                  val availList = all.filter { !it.isDisplayed }.toMutableList()

                  val actAdap = TileAdapter(actList, { t, p ->
                      t.isDisplayed = false; actList.removeAt(p); availList.add(0, t)
                      rvAct.adapter?.notifyDataSetChanged(); rvAvail.adapter?.notifyDataSetChanged()
                  })
                  val availAdap = TileAdapter(availList, { t, p ->
                      t.isDisplayed = true; availList.removeAt(p); actList.add(t)
                      actAdap.notifyDataSetChanged(); rvAvail.adapter?.notifyDataSetChanged()
                  })
                  rvAct.layoutManager = GridLayoutManager(this, 3); rvAct.adapter = actAdap
                  rvAvail.layoutManager = GridLayoutManager(this, 2); rvAvail.adapter = availAdap
                  findViewById<TextView>(R.id.btnDone).setOnClickListener {
                      TileRegistry.saveTiles(this, all)
                      finish()
                  }
              }
          }
          EOF

          # 11. VivoOverlayService.kt
          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/VivoOverlayService.kt
          package com.vivo.funtouch.shortcutcenter
          import android.annotation.SuppressLint
          import android.app.*
          import android.content.*
          import android.graphics.PixelFormat
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.*
          import android.provider.*
          import android.view.*
          import androidx.core.app.NotificationCompat
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView

          class VivoOverlayService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var triggerView: View
              private lateinit var panelView: View
              private lateinit var vibrator: Vibrator
              private var isPanelOpen = false
              private var isTorchOn = false

              override fun onBind(intent: Intent?) = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  val cid = "vivo_shortcut_center_bg"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(cid, "Vivo Shortcut Center", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(ch)
                  }
                  startForeground(1001, NotificationCompat.Builder(this, cid).setContentTitle("Shortcut Center").setContentText("Active").setSmallIcon(android.R.drawable.ic_menu_compass).setPriority(NotificationCompat.PRIORITY_LOW).build())
                  setupBottomTrigger()
                  private fun setupVivoPanel() {
                  panelView = LayoutInflater.from(this).inflate(R.layout.layout_vivo_shortcut_center, null)
                  val brightness = panelView.findViewById<VivoVerticalSlider>(R.id.sliderBrightness)
                  val volume = panelView.findViewById<VivoVerticalSlider>(R.id.sliderVolume)
                  val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val rvTiles = panelView.findViewById<RecyclerView>(R.id.rvActiveTiles)
                  volume.isVolume = true
                  volume.onProgressChanged = { am.setStreamVolume(AudioManager.STREAM_MUSIC, (it * am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)).toInt(), 0) }
                  brightness.onProgressChanged = { if (Settings.System.canWrite(this)) Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS, (it * 255).toInt()) }

                  val tiles = TileRegistry.loadSavedTiles(this).filter { it.isDisplayed }.toMutableList()
                  val adapter = TileAdapter(tiles, { t, pos ->
                      vibe()
                      when (t.id) {
                          "torch" -> try { val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager; isTorchOn = !isTorchOn; cm.setTorchMode(cm.cameraIdList[0], isTorchOn) } catch (e: Exception) {}
                          "wifi" -> startActivity(Intent(Settings.ACTION_WIFI_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                          "bluetooth" -> startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                          "data" -> startActivity(Intent(Settings.ACTION_DATA_ROAMING_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                          "dark", "eye" -> startActivity(Intent(Settings.ACTION_DISPLAY_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                          "vibrate" -> am.ringerMode = if (am.ringerMode == AudioManager.RINGER_MODE_VIBRATE) AudioManager.RINGER_MODE_NORMAL else AudioManager.RINGER_MODE_VIBRATE
                          "airplane" -> startActivity(Intent(Settings.ACTION_AIRPLANE_MODE_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                          "location" -> startActivity(Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                          "hotspot" -> startActivity(Intent(Settings.ACTION_WIRELESS_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                          "calc" -> (packageManager.getLaunchIntentForPackage("com.android.calculator2") ?: packageManager.getLaunchIntentForPackage("com.google.android.calculator"))?.let { startActivity(it.apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) }
                          "camera" -> startActivity(Intent("android.media.action.STILL_IMAGE_CAMERA").apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                          "dnd" -> startActivity(Intent(Settings.ACTION_ZEN_MODE_PRIORITY_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                          "low_power", "super_battery" -> startActivity(Intent(Settings.ACTION_BATTERY_SAVER_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                      }
                      t.isActive = !t.isActive; rvTiles.adapter?.notifyItemChanged(pos)
                  }, { t, _ ->
                      vibe(); hidePanel()
                      val intent = when (t.id) {
                          "wifi" -> Intent(Settings.ACTION_WIFI_SETTINGS)
                          "bluetooth" -> Intent(Settings.ACTION_BLUETOOTH_SETTINGS)
                          "data" -> Intent(Settings.ACTION_DATA_ROAMING_SETTINGS)
                          "dark", "eye" -> Intent(Settings.ACTION_DISPLAY_SETTINGS)
                          "vibrate" -> Intent(Settings.ACTION_SOUND_SETTINGS)
                          "airplane" -> Intent(Settings.ACTION_AIRPLANE_MODE_SETTINGS)
                          "location" -> Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS)
                          "dnd" -> Intent(Settings.ACTION_ZEN_MODE_PRIORITY_SETTINGS)
                          else -> Intent(Settings.ACTION_SETTINGS)
                      }
                      try { startActivity(intent.apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) } catch (e: Exception) {}
                  })
                  rvTiles.layoutManager = GridLayoutManager(this, 3); rvTiles.adapter = adapter

                  panelView.findViewById<View>(R.id.cardCalendar).setOnClickListener { try { startActivity(Intent(Intent.ACTION_VIEW).setData(CalendarContract.CONTENT_URI).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) } catch (e: Exception) {} }
                  panelView.findViewById<View>(R.id.cardFiles).setOnClickListener { try { startActivity(Intent(Intent.ACTION_GET_CONTENT).setType("*/*").apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) } catch (e: Exception) {} }
                  panelView.findViewById<View>(R.id.cardHome).setOnClickListener { try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("geo:0,0?q=Home")).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) } catch (e: Exception) {} }
                  panelView.findViewById<View>(R.id.cardTrending).setOnClickListener { try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/feed/trending")).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) } catch (e: Exception) {} }

                  panelView.findViewById<View>(R.id.appWhatsApp).setOnClickListener { packageManager.getLaunchIntentForPackage("com.whatsapp")?.let { startActivity(it.apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) } }
                  panelView.findViewById<View>(R.id.appYouTube).setOnClickListener { packageManager.getLaunchIntentForPackage("com.google.android.youtube")?.let { startActivity(it.apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) } }
                  panelView.findViewById<View>(R.id.appChrome).setOnClickListener { packageManager.getLaunchIntentForPackage("com.android.chrome")?.let { startActivity(it.apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) } }
                  panelView.findViewById<View>(R.id.appCamera).setOnClickListener { try { startActivity(Intent("android.media.action.STILL_IMAGE_CAMERA").apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) } catch (e: Exception) {} }

                  panelView.findViewById<View>(R.id.btnClose).setOnClickListener { vibe(); hidePanel() }
                  panelView.findViewById<View>(R.id.btnCollapse).setOnClickListener { vibe(); hidePanel() }
                  panelView.findViewById<View>(R.id.btnCustomTiles).setOnClickListener { vibe(); hidePanel(); startActivity(Intent(this, CustomTilesActivity::class.java).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) }
                  panelView.findViewById<View>(R.id.btnSystemSettings).setOnClickListener { vibe(); hidePanel(); startActivity(Intent(Settings.ACTION_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) }
              }

              private fun vibe() { if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) vibrator.vibrate(VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK)) }

              private fun showPanel() {
                  if (isPanelOpen) return
                  setupVivoPanel()
                  wm.addView(panelView, WindowManager.LayoutParams(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, PixelFormat.TRANSLUCENT))
                  isPanelOpen = true
                  panelView.translationY = 1200f; panelView.animate().translationY(0f).setDuration(220).start()
              }

              private fun hidePanel() {
                  if (!isPanelOpen) return
                  panelView.animate().translationY(1200f).setDuration(180).withEndAction { try { wm.removeView(panelView) } catch (e: Exception) {}; isPanelOpen = false }.start()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { if (::triggerView.isInitialized) wm.removeView(triggerView) } catch (e: Exception) {}
                  try { if (isPanelOpen && ::panelView.isInitialized) wm.removeView(panelView) } catch (e: Exception) {}
              }
          }
          EOF

          # 12. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/MainActivity.kt
          package com.vivo.funtouch.shortcutcenter
          import android.content.*
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(50, 60, 50, 50) }
                  layout.addView(TextView(this).apply { text = "Vivo Shortcut Center"; textSize = 22f; setPadding(0, 0, 0, 24) })

                  layout.addView(Button(this).apply { text = "1. Enable Floating Overlay"; setOnClickListener { startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))) } })
                  layout.addView(Button(this).apply { text = "2. Enable Brightness Permission"; setOnClickListener { startActivity(Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:$packageName"))) } })
                  layout.addView(Button(this).apply {
                      text = "3. Disable Battery Restrictions"
                      setOnClickListener {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              val pm = getSystemService(PowerManager::class.java)
                              if (!pm.isIgnoringBatteryOptimizations(packageName)) startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply { data = Uri.parse("package:$packageName") })
                              else Toast.makeText(this@MainActivity, "Already whitelisted!", Toast.LENGTH_SHORT).show()
                          }
                      }
                  })
                  layout.addView(Button(this).apply {
                      text = "4. Open Vivo Autostart Settings"
                      setOnClickListener {
                          val intents = arrayOf(
                              Intent().setComponent(ComponentName("com.vivo.permissionmanager", "com.vivo.permissionmanager.activity.BgStartUpManagerActivity")),
                              Intent().setComponent(ComponentName("com.iqoo.secure", "com.iqoo.secure.ui.phoneoptimize.AddWhiteListActivity")),
                              Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).setData(Uri.parse("package:$packageName"))
                          )
                          for (it in intents) { try { startActivity(it); return@setOnClickListener } catch (e: Exception) {} }
                      }
                  })

                  val prefs = getSharedPreferences("vivo_shortcut_prefs", Context.MODE_PRIVATE)
                  layout.addView(Switch(this).apply {
                      text = "Start automatically on phone restart"
                      isChecked = prefs.getBoolean("pref_start_on_boot", false)
                      setPadding(0, 24, 0, 24)
                      setOnCheckedChangeListener { _, c -> prefs.edit().putBoolean("pref_start_on_boot", c).apply() }
                  })

                  layout.addView(Button(this).apply {
                      text = "5. Start Shortcut Center Now"
                      setOnClickListener {
                          if (Settings.canDrawOverlays(this@MainActivity)) {
                              val s = Intent(this@MainActivity, VivoOverlayService::class.java)
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(s) else startService(s)
                              Toast.makeText(this@MainActivity, "Shortcut Center Active! Swipe up from bottom edge", Toast.LENGTH_LONG).show()
                          } else Toast.makeText(this@MainActivity, "Grant Floating Overlay first", Toast.LENGTH_SHORT).show()
                      }
                  })
                  setContentView(layout)
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Collect and Rename APK
        run: |
          mkdir -p apk_output
          find . -name "*.apk" -exec cp {} apk_output/VivoControlCenter.apk \;
          ls -lh apk_output/

      - name: Export APK File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vivo-Control-Center-APK
          path: apk_output/VivoControlCenter.apk
          if-no-files-found: error

      # Guaranteed Release publishing using dynamic build tags
      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Vivo Control Center (Build #${{ github.run_number }})"
          body: "Direct APK file for Vivo S1 Pro. Tap below to download and install."
          files: apk_output/VivoControlCenter.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
