          # 9. BootReceiver.kt
          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/BootReceiver.kt
          package com.vivo.funtouch.shortcutcenter
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.provider.Settings

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val action = intent.action
                  if (action == Intent.ACTION_BOOT_COMPLETED ||
                      action == Intent.ACTION_LOCKED_BOOT_COMPLETED ||
                      action == "android.intent.action.QUICKBOOT_POWERON" ||
                      action == "com.htc.intent.action.QUICKBOOT_POWERON") {

                      val prefs = context.getSharedPreferences("vivo_shortcut_prefs", Context.MODE_PRIVATE)
                      val startOnBootEnabled = prefs.getBoolean("pref_start_on_boot", false)

                      if (startOnBootEnabled && Settings.canDrawOverlays(context)) {
                          val serviceIntent = Intent(context, VivoOverlayService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              context.startForegroundService(serviceIntent)
                          } else {
                              context.startService(serviceIntent)
                          }
                      }
                  }
              }
          }
          EOF

