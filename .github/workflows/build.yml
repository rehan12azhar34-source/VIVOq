              fill = "#00000000" if stroke else "#FFFFFFFF"
              sc = "#FFFFFFFF" if stroke else "#00000000"
              return f'<vector xmlns:android=\"http://schemas.android.com/apk/res/android\" android:width=\"24dp\" android:height=\"24dp\" android:viewportWidth=\"24\" android:viewportHeight=\"24\"><path android:fillColor=\"{fill}\" android:strokeColor=\"{sc}\" android:strokeWidth=\"{stroke}\" android:pathData=\"{path}\"/></vector>'

