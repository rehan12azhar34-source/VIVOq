          # 11. VivoOverlayService.kt (Smooth Dismiss on Long Press & 1-Click Toggles)
          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/VivoOverlayService.kt
          package com.vivo.funtouch.shortcutcenter
          import android.annotation.SuppressLint
          import android.app.*
          import android.bluetooth.BluetoothAdapter
          import android.content.*
          import android.graphics.PixelFormat
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.net.wifi.WifiManager
          import android.os.*
          import android.provider.*
          import android.view.*
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView

          class VivoOverlayService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var triggerView: View
              private lateinit var panelView: View
              private lateinit var vibrator: Vibrator
              private var isPanelOpen = false
              private var isTorchOn = false

              override fun onBind(intent: Intent?) = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  val cid = "vivo_shortcut_center_bg"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(cid, "Vivo Shortcut Center", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(ch)
                  }
                  startForeground(1001, NotificationCompat.Builder(this, cid).setContentTitle("Shortcut Center").setContentText("Active").setSmallIcon(android.R.drawable.ic_menu_compass).setPriority(NotificationCompat.PRIORITY_LOW).build())
                  setupBottomTrigger()
                  setupVivoPanel()
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupBottomTrigger() {
                  val params = WindowManager.LayoutParams(WindowManager.LayoutParams.MATCH_PARENT, 60, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, PixelFormat.TRANSLUCENT).apply { gravity = Gravity.BOTTOM }
                  triggerView = View(this)
                  var startY = 0f
                  triggerView.setOnTouchListener { _, ev ->
                      if (ev.action == MotionEvent.ACTION_DOWN) { startY = ev.rawY; true }
                      else if (ev.action == MotionEvent.ACTION_MOVE && (startY - ev.rawY > 22) && !isPanelOpen) {
                          vibeClick(); showPanel(); true
                      } else false
                  }
                  wm.addView(triggerView, params)
              }

              private fun setupVivoPanel() {
                  panelView = LayoutInflater.from(this).inflate(R.layout.layout_vivo_shortcut_center, null)
                  val brightness = panelView.findViewById<VivoVerticalSlider>(R.id.sliderBrightness)
                  val volume = panelView.findViewById<VivoVerticalSlider>(R.id.sliderVolume)
                  val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager

                  volume.isVolume = true
                  volume.onProgressChanged = { am.setStreamVolume(AudioManager.STREAM_MUSIC, (it * am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)).toInt(), 0) }
                  brightness.onProgressChanged = { if (Settings.System.canWrite(this)) Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS, (it * 255).toInt()) }

                  val row1Tiles = TileRegistry.getRow1Tiles()
                  val row2Tiles = TileRegistry.getRow2Tiles()
                  val bottomTiles = TileRegistry.getBottomGridTiles()

                  val rvRow1 = panelView.findViewById<RecyclerView>(R.id.rvTilesRow1)
                  val rvRow2 = panelView.findViewById<RecyclerView>(R.id.rvTilesRow2)
                  val rvBottom = panelView.findViewById<RecyclerView>(R.id.rvBottomTiles)

                  val makeAdap = { list: MutableList<ShortcutTile>, rv: RecyclerView ->
                      TileAdapter(list, { t, pos ->
                          vibeClick()
                          toggleTile(t)
                          rv.adapter?.notifyItemChanged(pos)
                      }, { t, _ ->
                          openTileSettings(t.id)
                      })
                  }

                  rvRow1.layoutManager = GridLayoutManager(this, 5)
                  rvRow1.adapter = makeAdap(row1Tiles, rvRow1)

                  rvRow2.layoutManager = GridLayoutManager(this, 5)
                  rvRow2.adapter = makeAdap(row2Tiles, rvRow2)

                  rvBottom.layoutManager = GridLayoutManager(this, 3)
                  rvBottom.adapter = makeAdap(bottomTiles, rvBottom)

                  // App Card Click Handlers
                  panelView.findViewById<View>(R.id.cardWhatsApp).setOnClickListener { vibeClick(); launchPkg("com.whatsapp", "https://web.whatsapp.com") }
                  panelView.findViewById<View>(R.id.cardYouTube).setOnClickListener { vibeClick(); launchPkg("com.google.android.youtube", "https://youtube.com") }
                  panelView.findViewById<View>(R.id.cardFacebook).setOnClickListener { vibeClick(); launchPkg("com.facebook.katana", "https://facebook.com") }
                  panelView.findViewById<View>(R.id.cardTikTok).setOnClickListener { vibeClick(); launchPkg("com.zhiliaoapp.musically", "https://tiktok.com") }
                  panelView.findViewById<View>(R.id.cardFileManager).setOnClickListener {
                      vibeClick()
                      hidePanel {
                          try { startActivity(Intent(Intent.ACTION_GET_CONTENT).setType("*/*").apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) } catch (e: Exception) {}
                      }
                  }

                  // Developer Option Card
                  panelView.findViewById<View>(R.id.cardDeveloperOption).setOnClickListener {
                      vibeClick()
                      hidePanel {
                          try {
                              startActivity(Intent(Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP) })
                          } catch (e: Exception) {
                              startActivity(Intent(Settings.ACTION_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                          }
                      }
                  }

                  // Auto-brightness 'A' Toggle
                  panelView.findViewById<View>(R.id.btnAutoBrightness).setOnClickListener {
                      vibeClick()
                      if (Settings.System.canWrite(this)) {
                          val mode = Settings.System.getInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE, Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL)
                          val next = if (mode == Settings.System.SCREEN_BRIGHTNESS_MODE_AUTOMATIC) Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL else Settings.System.SCREEN_BRIGHTNESS_MODE_AUTOMATIC
                          Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE, next)
                      }
                  }

                  panelView.findViewById<View>(R.id.btnSystemSettings).setOnClickListener {
                      vibeClick()
                      hidePanel {
                          startActivity(Intent(Settings.ACTION_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP) })
                      }
                  }
              }

              // --- 1-CLICK INSTANT TOGGLES ---
              private fun toggleTile(t: ShortcutTile) {
                  val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  when (t.id) {
                      "torch" -> {
                          try {
                              val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                              isTorchOn = !isTorchOn
                              cm.setTorchMode(cm.cameraIdList[0], isTorchOn)
                              t.isActive = isTorchOn
                          } catch (e: Exception) {}
                      }
                      "wifi" -> {
                          try {
                              val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                              @Suppress("DEPRECATION")
                              wm.isWifiEnabled = !wm.isWifiEnabled
                              t.isActive = !t.isActive
                          } catch (e: Exception) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  startActivity(Intent(Settings.Panel.ACTION_WIFI).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                              }
                          }
                      }
                      "bluetooth" -> {
                          try {
                              val bt = BluetoothAdapter.getDefaultAdapter()
                              if (bt != null) {
                                  @Suppress("DEPRECATION")
                                  if (bt.isEnabled) bt.disable() else bt.enable()
                                  t.isActive = !t.isActive
                              }
                          } catch (e: Exception) {}
                      }
                      "rotation" -> {
                          if (Settings.System.canWrite(this)) {
                              val cur = Settings.System.getInt(contentResolver, Settings.System.ACCELEROMETER_ROTATION, 0)
                              val next = if (cur == 1) 0 else 1
                              Settings.System.putInt(contentResolver, Settings.System.ACCELEROMETER_ROTATION, next)
                              t.isActive = (next == 1)
                          }
                      }
                      "vibrate" -> {
                          am.ringerMode = if (am.ringerMode == AudioManager.RINGER_MODE_VIBRATE) AudioManager.RINGER_MODE_NORMAL else AudioManager.RINGER_MODE_VIBRATE
                          t.isActive = (am.ringerMode == AudioManager.RINGER_MODE_VIBRATE)
                      }
                      "silent" -> {
                          am.ringerMode = if (am.ringerMode == AudioManager.RINGER_MODE_SILENT) AudioManager.RINGER_MODE_NORMAL else AudioManager.RINGER_MODE_SILENT
                          t.isActive = (am.ringerMode == AudioManager.RINGER_MODE_SILENT)
                      }
                      "speed", "ram" -> {
                          t.isActive = true
                          vibeClick()
                          Toast.makeText(this, "Storage & RAM Optimized!", Toast.LENGTH_SHORT).show()
                      }
                      "data" -> {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              startActivity(Intent(Settings.Panel.ACTION_INTERNET_CONNECTIVITY).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                          } else {
                              startActivity(Intent(Settings.ACTION_DATA_ROAMING_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                          }
                      }
                      "calc" -> (packageManager.getLaunchIntentForPackage("com.android.calculator2") ?: packageManager.getLaunchIntentForPackage("com.google.android.calculator"))?.let { startActivity(it.apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) }
                      "camera" -> startActivity(Intent("android.media.action.STILL_IMAGE_CAMERA").apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                      "hotspot" -> startActivity(Intent(Settings.ACTION_WIRELESS_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                      "airplane" -> startActivity(Intent(Settings.ACTION_AIRPLANE_MODE_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                      "power", "restart" -> {
                          val intent = Intent(Intent.ACTION_SHUTDOWN).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }
                          try { startActivity(intent) } catch (e: Exception) {
                              Toast.makeText(this, "Long press power key on device", Toast.LENGTH_SHORT).show()
                          }
                      }
                      else -> t.isActive = !t.isActive
                  }
              }

              // --- LONG PRESS: DISMISS PANEL & DIRECT SETTINGS LAUNCH ---
              private fun openTileSettings(tileId: String) {
                  vibeHeavy()
                  val intent = when (tileId) {
                      "wifi" -> Intent(Settings.ACTION_WIFI_SETTINGS)
                      "bluetooth" -> Intent(Settings.ACTION_BLUETOOTH_SETTINGS)
                      "data" -> Intent(Settings.ACTION_DATA_ROAMING_SETTINGS)
                      "dark", "eye" -> Intent(Settings.ACTION_DISPLAY_SETTINGS)
                      "vibrate", "silent" -> Intent(Settings.ACTION_SOUND_SETTINGS)
                      "rotation" -> Intent(Settings.ACTION_DISPLAY_SETTINGS)
                      "hotspot" -> Intent(Settings.ACTION_WIRELESS_SETTINGS)
                      "low_power", "super_battery", "live_power", "power_share" -> Intent(Settings.ACTION_BATTERY_SAVER_SETTINGS)
                      "ram" -> Intent(Settings.ACTION_INTERNAL_STORAGE_SETTINGS)
                      else -> Intent(Settings.ACTION_SETTINGS)
                  }
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                  hidePanel {
                      try { startActivity(intent) } catch (e: Exception) {
                          try { startActivity(Intent(Settings.ACTION_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) } catch (ex: Exception) {}
                      }
                  }
              }

              private fun launchPkg(pkg: String, fallbackUrl: String) {
                  hidePanel {
                      val intent = packageManager.getLaunchIntentForPackage(pkg)
                      if (intent != null) {
                          startActivity(intent.apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                      } else {
                          try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(fallbackUrl)).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) } catch (e: Exception) {}
                      }
                  }
              }

              private fun vibeClick() { if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) vibrator.vibrate(VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK)) }
              private fun vibeHeavy() { if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) vibrator.vibrate(VibrationEffect.createPredefined(VibrationEffect.EFFECT_HEAVY_CLICK)) }

              private fun showPanel() {
                  if (isPanelOpen) return
                  setupVivoPanel()
                  wm.addView(panelView, WindowManager.LayoutParams(WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS, PixelFormat.TRANSLUCENT))
                  isPanelOpen = true
                  panelView.translationY = 1400f
                  panelView.animate().translationY(0f).setDuration(200).setInterpolator(android.view.animation.DecelerateInterpolator()).start()
              }

              private fun hidePanel(onClosed: (() -> Unit)? = null) {
                  if (!isPanelOpen) {
                      onClosed?.invoke()
                      return
                  }
                  isPanelOpen = false
                  panelView.animate().translationY(1400f).setDuration(160).setInterpolator(android.view.animation.AccelerateInterpolator()).withEndAction {
                      try { wm.removeView(panelView) } catch (e: Exception) {}
                      onClosed?.invoke()
                  }.start()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  try { if (::triggerView.isInitialized) wm.removeView(triggerView) } catch (e: Exception) {}
                  try { if (isPanelOpen && ::panelView.isInitialized) wm.removeView(panelView) } catch (e: Exception) {}
              }
          }
          EOF

          # 12. MainActivity.kt (Professional App Dashboard with Real-Time Badges)
          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/MainActivity.kt
          package com.vivo.funtouch.shortcutcenter
          import android.content.*
          import android.graphics.Color
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  findViewById<RelativeLayout>(R.id.btnOverlayPermission).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }

                  findViewById<RelativeLayout>(R.id.btnWritePermission).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:$packageName")))
                  }

                  findViewById<RelativeLayout>(R.id.btnBatteryWhitelist).setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val pm = getSystemService(PowerManager::class.java)
                          if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                              startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                  data = Uri.parse("package:$packageName")
                              })
                          } else {
                              Toast.makeText(this, "Battery whitelist already active!", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  findViewById<RelativeLayout>(R.id.btnVivoAutostart).setOnClickListener {
                      val intents = arrayOf(
                          Intent().setComponent(ComponentName("com.vivo.permissionmanager", "com.vivo.permissionmanager.activity.BgStartUpManagerActivity")),
                          Intent().setComponent(ComponentName("com.iqoo.secure", "com.iqoo.secure.ui.phoneoptimize.AddWhiteListActivity")),
                          Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).setData(Uri.parse("package:$packageName"))
                      )
                      for (it in intents) { try { startActivity(it); return@setOnClickListener } catch (e: Exception) {} }
                  }

                  val prefs = getSharedPreferences("vivo_shortcut_prefs", Context.MODE_PRIVATE)
                  val switchBoot = findViewById<Switch>(R.id.switchAutoBoot)
                  switchBoot.isChecked = prefs.getBoolean("pref_start_on_boot", false)
                  switchBoot.setOnCheckedChangeListener { _, isChecked ->
                      prefs.edit().putBoolean("pref_start_on_boot", isChecked).apply()
                  }

                  findViewById<Button>(R.id.btnLaunchService).setOnClickListener {
                      if (Settings.canDrawOverlays(this)) {
                          val svc = Intent(this, VivoOverlayService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(svc) else startService(svc)
                          Toast.makeText(this, "Shortcut Center Active! Swipe up from bottom edge", Toast.LENGTH_LONG).show()
                      } else {
                          Toast.makeText(this, "Please grant Floating Overlay first", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  updateBadges()
              }

              // Real-Time Badge Updates (Turns Emerald Green when granted)
              private fun updateBadges() {
                  val txtOverlay = findViewById<TextView>(R.id.txtOverlayStatus)
                  if (Settings.canDrawOverlays(this)) {
                      txtOverlay.text = "Active ✓"
                      txtOverlay.setTextColor(Color.parseColor("#22C55E"))
                  } else {
                      txtOverlay.text = "Enable ➔"
                      txtOverlay.setTextColor(Color.parseColor("#4D6EF5"))
                  }

                  val txtWrite = findViewById<TextView>(R.id.txtWriteStatus)
                  if (Settings.System.canWrite(this)) {
                      txtWrite.text = "Active ✓"
                      txtWrite.setTextColor(Color.parseColor("#22C55E"))
                  } else {
                      txtWrite.text = "Enable ➔"
                      txtWrite.setTextColor(Color.parseColor("#4D6EF5"))
                  }

                  val txtBattery = findViewById<TextView>(R.id.txtBatteryStatus)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val pm = getSystemService(PowerManager::class.java)
                      if (pm.isIgnoringBatteryOptimizations(packageName)) {
                          txtBattery.text = "Whitelisted ✓"
                          txtBattery.setTextColor(Color.parseColor("#22C55E"))
                      } else {
                          txtBattery.text = "Ignore ➔"
                          txtBattery.setTextColor(Color.parseColor("#4D6EF5"))
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Collect and Rename APK
        run: |
          mkdir -p apk_output
          find . -name "*.apk" -exec cp {} apk_output/VivoControlCenter.apk \;
          ls -lh apk_output/

      - name: Export APK File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vivo-Control-Center-APK
          path: apk_output/VivoControlCenter.apk
          if-no-files-found: error

      - name: Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Vivo Control Center (Build #${{ github.run_number }})"
          body: "Direct APK file for Vivo S1 Pro with professional App Dashboard, new app icon, and instant 1-click toggles."
          files: apk_output/VivoControlCenter.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
