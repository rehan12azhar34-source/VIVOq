          package com.vivo.funtouch.shortcutcenter
          import android.graphics.Color
          import android.view.*
          import android.widget.*
          import androidx.recyclerview.widget.RecyclerView

          class TileAdapter(val tiles: MutableList<ShortcutTile>, private val click: (ShortcutTile, Int) -> Unit, private val longClick: ((ShortcutTile, Int) -> Unit)? = null) : RecyclerView.Adapter<TileAdapter.VH>() {
              inner class VH(v: View) : RecyclerView.ViewHolder(v) {
                  val bg: FrameLayout = v.findViewById(R.id.tileBackground); val icon: ImageView = v.findViewById(R.id.tileIcon); val label: TextView = v.findViewById(R.id.tileLabel)
              }
              override fun onCreateViewHolder(p: ViewGroup, vt: Int) = VH(LayoutInflater.from(p.context).inflate(R.layout.item_vivo_tile, p, false))
              override fun onBindViewHolder(h: VH, pos: Int) {
                  val t = tiles[pos]
                  h.label.text = t.title; h.icon.setImageResource(t.iconRes)
                  h.bg.setBackgroundResource(if (t.isActive) R.drawable.bg_circle_toggle_active else R.drawable.bg_circle_toggle_inactive)
                  h.label.setTextColor(Color.parseColor(if (t.isActive) "#5B7BFA" else "#B0B4C0"))
                  h.itemView.setOnClickListener { click(t, pos) }
                  h.itemView.setOnLongClickListener { longClick?.invoke(t, pos); true }
              }
              override fun getItemCount() = tiles.size
          }
