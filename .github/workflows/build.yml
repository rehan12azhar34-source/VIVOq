              fun loadSavedTiles(context: Context): ArrayList<ShortcutTile> {
                  val all = getAllAvailableTiles()
                  val prefs = context.getSharedPreferences("vivo_tiles_prefs", Context.MODE_PRIVATE)
                  val activeSet = prefs.getStringSet("active_tile_ids", null) ?: return all

                  for (tile in all) {
                      tile.isDisplayed = activeSet.contains(tile.id)
                  }
                  return all
              }

              fun saveTiles(context: Context, tiles: List<ShortcutTile>) {
                  val prefs = context.getSharedPreferences("vivo_tiles_prefs", Context.MODE_PRIVATE)
                  val activeIds = tiles.filter { it.isDisplayed }.map { it.id }.toSet()
                  prefs.edit().putStringSet("active_tile_ids", activeIds).apply()
              }
          }
