name: Build Vivo Control Center APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Accept Pre-installed Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Custom Vivo Files
        run: |
          mkdir -p app/src/main/java/com/vivo/funtouch/shortcutcenter
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VivoShortcutCenter"
          include ':app'
          EOF

          # root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.vivo.funtouch.shortcutcenter'
              compileSdk 34
              defaultConfig {
                  applicationId "com.myvivo.s1pro.shortcutcenter"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
          }
          EOF

          # styles.xml
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.VivoFuntouch" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:colorBackgroundCacheHint">@null</item>
                  <item name="android:windowIsTranslucent">true</item>
              </style>
          </resources>
          EOF

          # Drawables
          cat << 'EOF' > app/src/main/res/drawable/bg_panel_blur.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#E615171E" />
              <corners android:topLeftRadius="24dp" android:topRightRadius="24dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_service_card.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#26323D4D" />
              <corners android:radius="14dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_circle_toggle_inactive.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#403C4454" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_circle_toggle_active.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#FFFFFFFF" />
          </shape>
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <application
                  android:label="Shortcut Center"
                  android:theme="@style/Theme.VivoFuntouch">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".CustomTilesActivity" android:exported="false" />
                  <service android:name=".VivoOverlayService" android:enabled="true" android:exported="false" />
              </application>
          </manifest>
          EOF

          # ShortcutTile.kt
          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/ShortcutTile.kt
          package com.vivo.funtouch.shortcutcenter

          data class ShortcutTile(
              val id: String,
              val title: String,
              val icon: String,
              var isActive: Boolean = false,
              var isDisplayed: Boolean = true
          )

          object TileRegistry {
              fun getDefaultTiles(): ArrayList<ShortcutTile> {
                  return arrayListOf(
                      ShortcutTile("eye", "Eye\nProtection", "👁", isDisplayed = true),
                      ShortcutTile("dark", "Dark Mode", "☼", isDisplayed = true),
                      ShortcutTile("wifi", "Wi-Fi", "📶", isActive = true, isDisplayed = true),
                      ShortcutTile("scapture", "S-capture", "⛶", isDisplayed = true),
                      ShortcutTile("vibrate", "Vibration\nMode", "📳", isDisplayed = true),
                      ShortcutTile("data", "Data\nnetwork", "⇅", isDisplayed = true),
                      ShortcutTile("speed", "Speed up", "🚀", isDisplayed = true),
                      ShortcutTile("bluetooth", "Bluetooth", "ᛒ", isDisplayed = true),
                      ShortcutTile("location", "Location", "📍", isDisplayed = true),
                      ShortcutTile("sim", "Switch SIM\ncard", "1️⃣", isDisplayed = true),
                      ShortcutTile("torch", "Flashlight", "🔦", isDisplayed = true),
                      ShortcutTile("easytouch", "Easy Touch", "◎", isDisplayed = true),
                      ShortcutTile("calc", "Calculator", "🧮", isDisplayed = true),
                      ShortcutTile("game", "Ultra Game\nMode", "🎮", isDisplayed = true),
                      ShortcutTile("hotspot", "Personal\nhotspot", "📡", isDisplayed = true),
                      ShortcutTile("silent", "Silent mode", "🔔", isDisplayed = true),
                      ShortcutTile("screenrec", "Record\nScreen", "📹", isDisplayed = true),
                      ShortcutTile("rotation", "Portrait\norientation", "🔄", isDisplayed = true),
                      ShortcutTile("airplane", "Airplane\nmode", "✈", isDisplayed = true),
                      ShortcutTile("splitscreen", "Split-screen", "◫", isDisplayed = true),
                      ShortcutTile("device_ctrl", "Device\ncontrols", "🏠", isDisplayed = false),
                      ShortcutTile("dnd", "Do Not\nDisturb", "🌙", isDisplayed = false),
                      ShortcutTile("low_power", "Low power\nmode", "🔋", isDisplayed = false),
                      ShortcutTile("super_battery", "Super Battery\nSaver", "⚡", isDisplayed = false),
                      ShortcutTile("camera", "Camera", "📷", isDisplayed = false),
                      ShortcutTile("power", "Power off", "⏻", isDisplayed = false),
                      ShortcutTile("mirroring", "Smart\nMirroring", "🖥", isDisplayed = false),
                      ShortcutTile("jovi", "Jovi Vision", "👁‍🗨", isDisplayed = false),
                      ShortcutTile("vivoshare", "vivoshare", "∞", isDisplayed = false),
                      ShortcutTile("nearby", "Nearby\nShare", "⇋", isDisplayed = false)
                  )
              }
          }
          EOF

          # VivoVerticalSlider.kt
          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/VivoVerticalSlider.kt
          pac
