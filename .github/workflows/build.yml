name: Build Vivo Control Center APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Accept Pre-installed Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Complete Vivo Project Files
        run: |
          python3 -c "
          import os
          from PIL import Image, ImageDraw

          pkg = 'app/src/main/java/com/vivo/funtouch/shortcutcenter'
          os.makedirs(pkg, exist_ok=True)
          os.makedirs('app/src/main/res/layout', exist_ok=True)
          os.makedirs('app/src/main/res/drawable', exist_ok=True)
          os.makedirs('app/src/main/res/values', exist_ok=True)

          # 1. Generate App Icon (Vivo Jovi Gradient Rings)
          img = Image.new('RGBA', (96, 96), (0,0,0,0))
          d = ImageDraw.Draw(img)
          d.ellipse([8, 12, 80, 84], outline=(64, 196, 255, 255), width=12)
          d.ellipse([22, 26, 74, 78], outline=(255, 64, 210, 255), width=11)
          for dens in ['hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi']:
              p = f'app/src/main/res/mipmap-{dens}'
              os.makedirs(p, exist_ok=True)
              img.save(f'{p}/ic_launcher.png')
              img.save(f'{p}/ic_launcher_round.png')

          # 2. Drawables (Matte Dark #1E2026, Blue #4D6EF5)
          open('app/src/main/res/drawable/bg_panel_blur.xml', 'w').write('<shape xmlns:android=\"http://schemas.android.com/apk/res/android\"><solid android:color=\"#F91E2026\"/></shape>')
          open('app/src/main/res/drawable/bg_service_card.xml', 'w').write('<shape xmlns:android=\"http://schemas.android.com/apk/res/android\"><solid android:color=\"#21232B\"/><corners android:radius=\"14dp\"/></shape>')
          open('app/src/main/res/drawable/bg_circle_toggle_inactive.xml', 'w').write('<shape xmlns:android=\"http://schemas.android.com/apk/res/android\" android:shape=\"oval\"><solid android:color=\"#2B2D38\"/></shape>')
          open('app/src/main/res/drawable/bg_circle_toggle_active.xml', 'w').write('<shape xmlns:android=\"http://schemas.android.com/apk/res/android\" android:shape=\"oval\"><solid android:color=\"#4D6EF5\"/></shape>')

          # 3. Vector Icons
          vec = lambda path, stroke=0: f'<vector xmlns:android=\"http://schemas.android.com/apk/res/android\" android:width=\"24dp\" android:height=\"24dp\" android:viewportWidth=\"24\" android:viewportHeight=\"24\"><path android:fillColor=\"{\"#00000000\" if stroke else \"#FFFFFFFF\"}\" android:strokeColor=\"{\"#FFFFFFFF\" if stroke else \"#00000000\"}\" android:strokeWidth=\"{stroke}\" android:pathData=\"{path}\"/></vector>'

          icons = {
              'ic_vivo_eye': ('M12,4.5C7,4.5 2.73,7.61 1,12c1.73,4.39 6,7.5 11,7.5s9.27,-3.11 11,-7.5c-1.73,-4.39 -6,-7.5 -11,-7.5zM12,17c-2.76,0 -5,-2.24 -5,-5s2.24,-5 5,-5 5,2.24 5,5 -2.24,5 -5,5zm0,-8c-1.66,0 -3,1.34 -3,3s1.34,3 3,3 3,-1.34 3,-3 -1.34,-3 -3,-3z', 0),
              'ic_vivo_dark': ('M12,7c-2.76,0 -5,2.24 -5,5s2.24,5 5,5 5,-2.24 5,-5 -2.24,-5 -5,-5zM12,2L12,5M12,19L12,22M4.22,4.22L6.34,6.34M17.66,17.66L19.78,19.78M2,12L5,12M19,12L22,12M4.22,19.78L6.34,17.66M17.66,6.34L19.78,4.22', 1.8),
              'ic_vivo_wifi': ('M12,3C7.79,3 3.97,4.59 1,7.24L12,21 23,7.24C20.03,4.59 16.21,3 12,3zM12,6c3.42,0 6.54,1.26 8.98,3.35L12,19.08 3.02,9.35C5.46,7.26 8.58,6 12,6z', 0),
              'ic_vivo_scapture': ('M4,9V5H8 M16,5H20V9 M20,15V19H16 M8,19H4V15', 2),
