name: Build Vivo Control Center APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Accept Pre-installed Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Complete Vivo Project Files
        run: |
          cat << 'EOF_PY' > generate_project.py
          import os

          pkg = 'app/src/main/java/com/vivo/funtouch/shortcutcenter'
          os.makedirs(pkg, exist_ok=True)
          os.makedirs('app/src/main/res/layout', exist_ok=True)
          os.makedirs('app/src/main/res/drawable', exist_ok=True)
          os.makedirs('app/src/main/res/values', exist_ok=True)

          # 1. New App Icon (Black Squircle with White Interlocking Rhombus Shortcuts Logo)
          icon_svg = '''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FF000000" android:pathData="M28,6h52c12.15,0 22,9.85 22,22v52c0,12.15 -9.85,22 -22,22H28c-12.15,0 -22,-9.85 -22,-22V28c0,-12.15 9.85,-22 22,-22z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M54,22L76.6,44.6c3.1,3.1 3.1,8.2 0,11.3L64.8,67.7c-2.4,2.4 -6.3,2.4 -8.7,0L44.3,55.9c-2.4,-2.4 -2.4,-6.3 0,-8.7l9.7,-9.7l6.8,6.8c1.2,1.2 3.1,1.2 4.2,0c1.2,-1.2 1.2,-3.1 0,-4.2L54,29.1l-7.9,7.9c-4.7,4.7 -4.7,12.3 0,17l11.8,11.8c4.7,4.7 12.3,4.7 17,0l11.8,-11.8c4.7,-4.7 4.7,-12.3 0,-17L66.3,16.6c-6.8,-6.8 -17.8,-6.8 -24.6,0L29.9,28.4c-1.2,1.2 -1.2,3.1 0,4.2c1.2,1.2 3.1,1.2 4.2,0L45.9,20.8c4.5,-4.5 11.7,-4.5 16.2,0z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M54,86L31.4,63.4c-3.1,-3.1 -3.1,-8.2 0,-11.3l11.8,-11.8c2.4,-2.4 6.3,-2.4 8.7,0l11.8,11.8c2.4,2.4 2.4,6.3 0,8.7L54,70.5l-6.8,-6.8c-1.2,-1.2 -3.1,-1.2 -4.2,0c-1.2,1.2 -1.2,3.1 0,4.2L54,78.9l7.9,-7.9c4.7,-4.7 4.7,-12.3 0,-17L50.1,42.2c-4.7,-4.7 -12.3,-4.7 -17,0L21.3,54c-4.7,4.7 -4.7,12.3 0,17l20.4,20.4c6.8,6.8 17.8,6.8 24.6,0l11.8,-11.8c1.2,-1.2 1.2,-3.1 0,-4.2c-1.2,-1.2 -3.1,-1.2 -4.2,0L62.1,87.2c-4.5,4.5 -11.7,4.5 -16.2,0z"/>
