          for name, (path, stroke) in icons.items():
              open(f'app/src/main/res/drawable/{name}.xml', 'w').write(make_vec(path, stroke))
          EOF_PY
          python3 generate_project.py

          # 3. Project Configuration Files
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=false
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "VivoShortcutCenter"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.vivo.funtouch.shortcutcenter'
              compileSdk 33
              defaultConfig {
                  applicationId "com.myvivo.s1pro.shortcutcenter"
                  minSdk 26
                  targetSdk 33
                  versionCode 22
                  versionName "22.0_ProfessionalAppUI"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.VivoFuntouch" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:colorBackgroundCacheHint">@null</item>
                  <item name="android:windowIsTranslucent">true</item>
              </style>
