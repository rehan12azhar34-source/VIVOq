              open(f'app/src/main/res/drawable/{name}.xml', 'w').write(vec(path, stroke))
          "

          # 3. Project Configuration Files
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=false
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "VivoShortcutCenter"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.vivo.funtouch.shortcutcenter'
              compileSdk 33
              defaultConfig {
                  applicationId "com.myvivo.s1pro.shortcutcenter"
                  minSdk 26
                  targetSdk 33
                  versionCode 16
                  versionName "16.0_CompactFast"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.VivoFuntouch" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:colorBackgroundCacheHint">@null</item>
                  <item name="android:windowIsTranslucent">true</item>
              </style>
          </resources>
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <application
                  android:label="Shortcut Center"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/Theme.VivoFuntouch">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".CustomTilesActivity" android:exported="false" />
                  <service android:name=".VivoOverlayService" android:enabled="true" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true" android:directBootAware="true">
                      <intent-filter android:priority="999">
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 5. BootReceiver.kt
          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/BootReceiver.kt
          package com.vivo.funtouch.shortcutcenter
          import android.content.*
          import android.os.Build
          import android.provider.Settings

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val prefs = context.getSharedPreferences("vivo_shortcut_prefs", Context.MODE_PRIVATE)
                  if (prefs.getBoolean("pref_start_on_boot", false) && Settings.canDrawOverlays(context)) {
                      val svc = Intent(context, VivoOverlayService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(svc) else context.startService(svc)
                  }
              }
          }
          EOF

          # 6. ShortcutTile.kt
          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/ShortcutTile.kt
          package com.vivo.funtouch.shortcutcenter
          import android.content.Context

          data class ShortcutTile(val id: String, val title: String, val iconRes: Int, var isActive: Boolean = false, var isDisplayed: Boolean = true)

          object TileRegistry {
              fun getAllAvailableTiles(): ArrayList<ShortcutTile> {
                  return arrayListOf(
                      ShortcutTile("wifi", "Wi-Fi", R.drawable.ic_vivo_wifi, isDisplayed = true),
                      ShortcutTile("dark", "Dark Mode", R.drawable.ic_vivo_dark, isActive = true, isDisplayed = true),
                      ShortcutTile("torch", "Flashlight", R.drawable.ic_vivo_torch, isDisplayed = true),
                      ShortcutTile("eye", "Eye\nProtection", R.drawable.ic_vivo_eye, isDisplayed = true),
                      ShortcutTile("data", "Data\nnetwork", R.drawable.ic_vivo_data, isDisplayed = true),
                      ShortcutTile("bluetooth", "Bluetooth", R.drawable.ic_vivo_bluetooth, isDisplayed = true),
                      ShortcutTile("vibrate", "Vibration\nMode", R.drawable.ic_vivo_vibrate, isDisplayed = true),
                      ShortcutTile("scapture", "S-capture", R.drawable.ic_vivo_scapture, isDisplayed = true),
                      ShortcutTile("speed", "Speed up", R.drawable.ic_vivo_rocket, isDisplayed = true),
                      ShortcutTile("location", "Location", R.drawable.ic_vivo_location, isDisplayed = true),
                      ShortcutTile("hotspot", "Personal\nhotspot", R.drawable.ic_vivo_hotspot, isDisplayed = true),
                      ShortcutTile("airplane", "Airplane\nmode", R.drawable.ic_vivo_airplane, isDisplayed = true),
                      ShortcutTile("rotation", "Portrait\norientation", R.drawable.ic_vivo_rotation, isDisplayed = true),
                      ShortcutTile("silent", "Silent mode", R.drawable.ic_vivo_silent, isDisplayed = true),
                      ShortcutTile("dnd", "Do Not\nDisturb", R.drawable.ic_vivo_dnd, isDisplayed = true),
                      ShortcutTile("low_power", "Low power\nmode", R.drawable.ic_vivo_battery, isDisplayed = true),
                      ShortcutTile("super_battery", "Super Battery\nSaver", R.drawable.ic_vivo_super_battery, isDisplayed = true),
                      ShortcutTile("screenrec", "Record\nScreen", R.drawable.ic_vivo_record, isDisplayed = true),
                      ShortcutTile("calc", "Calculator", R.drawable.ic_vivo_calc, isDisplayed = true),
                      ShortcutTile("camera", "Camera", R.drawable.ic_vivo_camera, isDisplayed = true),
                      ShortcutTile("sim", "Switch SIM\ncard", R.drawable.ic_vivo_sim, isDisplayed = true),
                      ShortcutTile("splitscreen", "Split-screen", R.drawable.ic_vivo_split, isDisplayed = true),
                      ShortcutTile("easytouch", "Easy Touch", R.drawable.ic_vivo_easytouch, isDisplayed = false),
                      ShortcutTile("game", "Ultra Game\nMode", R.drawable.ic_vivo_game, isDisplayed = false),
                      ShortcutTile("device_ctrl", "Device\ncontrols", R.drawable.ic_vivo_home, isDisplayed = false),
                      ShortcutTile("power", "Power off", R.drawable.ic_vivo_power, isDisplayed = false),
                      ShortcutTile("motorbike", "Motorbike\nmode", R.drawable.ic_vivo_motorbike, isDisplayed = false),
                      ShortcutTile("miniscreen", "Mini screen\nmode", R.drawable.ic_vivo_mini, isDisplayed = false),
                      ShortcutTile("mirroring", "Smart\nMirroring", R.drawable.ic_vivo_cast, isDisplayed = false),
                      ShortcutTile("jovi", "Jovi Vision", R.drawable.ic_vivo_jovi, isDisplayed = false),
                      ShortcutTile("vivoshare", "vivoshare", R.drawable.ic_vivo_share, isDisplayed = false),
                      ShortcutTile("nearby", "Nearby\nShare", R.drawable.ic_vivo_nearby, isDisplayed = false),
                      ShortcutTile("tileaction", "Tile action", R.drawable.ic_vivo_action, isDisplayed = false)
                  )
              }
              fun loadSavedTiles(ctx: Context): ArrayList<ShortcutTile> {
                  val all = getAllAvailableTiles()
                  val active = ctx.getSharedPreferences("vivo_tiles_prefs", Context.MODE_PRIVATE).getStringSet("active_ids", null) ?: return all
                  all.forEach { it.isDisplayed = active.contains(it.id) }
                  return all
              }
              fun saveTiles(ctx: Context, tiles: List<ShortcutTile>) {
                  val ids = tiles.filter { it.isDisplayed }.map { it.id }.toSet()
                  ctx.getSharedPreferences("vivo_tiles_prefs", Context.MODE_PRIVATE).edit().putStringSet("active_ids", ids).apply()
              }
          }
