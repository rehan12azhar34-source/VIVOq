          package com.vivo.funtouch.shortcutcenter
          import android.content.*
          import android.os.Build
          import android.provider.Settings

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val prefs = context.getSharedPreferences("vivo_shortcut_prefs", Context.MODE_PRIVATE)
                  if (prefs.getBoolean("pref_start_on_boot", false) && Settings.canDrawOverlays(context)) {
                      val svc = Intent(context, VivoOverlayService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) context.startForegroundService(svc) else context.startService(svc)
                  }
              }
          }
