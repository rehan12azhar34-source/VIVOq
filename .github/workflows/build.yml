                      ShortcutTile("bluetooth", "Bluetooth", R.drawable.ic_vivo_bluetooth, isDisplayed = true),
                      ShortcutTile("torch", "Flashlight", R.drawable.ic_vivo_torch, isDisplayed = true)
                  )
