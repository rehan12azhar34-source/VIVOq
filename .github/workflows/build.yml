              <path android:fillColor="#FFFFFFFF" android:pathData="M54,86L31.4,63.4c-3.1,-3.1 -3.1,-8.2 0,-11.3l11.8,-11.8c2.4,-2.4 6.3,-2.4 8.7,0l11.8,11.8c2.4,2.4 2.4,6.3 0,8.7L54,70.5l-6.8,-6.8c-1.2,-1.2 -3.1,-1.2 -4.2,0c-1.2,1.2 -1.2,3.1 0,4.2L54,78.9l7.9,-7.9c4.7,-4.7 4.7,-12.3 0,-17L50.1,42.2c-4.7,-4.7 -12.3,-4.7 -17,0L21.3,54c-4.7,4.7 -4.7,12.3 0,17l20.4,20.4c6.8,6.8 17.8,6.8 24.6,0l11.8,-11.8c1.2,-1.2 1.2,-3.1 0,-4.2c-1.2,-1.2 -3.1,-1.2 -4.2,0L62.1,87.2c-4.5,4.5 -11.7,4.5 -16.2,0z"/>
          </vector>'''

          open('app/src/main/res/drawable/ic_launcher.xml', 'w').write(icon_svg)
          open('app/src/main/res/drawable/ic_launcher_round.xml', 'w').write(round_svg)

          # 2. Drawables (Matte Dark #1E2026, Blue #4D6EF5, Card #1C1E27)
          open('app/src/main/res/drawable/bg_panel_blur.xml', 'w').write('<shape xmlns:android=\"http://schemas.android.com/apk/res/android\"><solid android:color=\"#F91E2026\"/></shape>')
          open('app/src/main/res/drawable/bg_service_card.xml', 'w').write('<shape xmlns:android=\"http://schemas.android.com/apk/res/android\"><solid android:color=\"#21232B\"/><corners android:radius=\"14dp\"/></shape>')
          open('app/src/main/res/drawable/bg_dashboard_card.xml', 'w').write('<shape xmlns:android=\"http://schemas.android.com/apk/res/android\"><solid android:color=\"#1C1E27\"/><corners android:radius=\"18dp\"/></shape>')
          open('app/src/main/res/drawable/bg_circle_toggle_inactive.xml', 'w').write('<shape xmlns:android=\"http://schemas.android.com/apk/res/android\" android:shape=\"oval\"><solid android:color=\"#2B2D38\"/></shape>')
          open('app/src/main/res/drawable/bg_circle_toggle_active.xml', 'w').write('<shape xmlns:android=\"http://schemas.android.com/apk/res/android\" android:shape=\"oval\"><solid android:color=\"#4D6EF5\"/></shape>')
          open('app/src/main/res/drawable/bg_circle_toggle_white.xml', 'w').write('<shape xmlns:android=\"http://schemas.android.com/apk/res/android\" android:shape=\"oval\"><solid android:color=\"#FFFFFFFF\"/></shape>')

