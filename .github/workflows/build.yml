name: Master CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: true
        default: '0.9'
      publish_release:
        description: 'Publish GitHub Release?'
        type: boolean
        required: true
        default: true

env:
  DEFAULT_VERSION: '0.9'
  APP_NAME: 'vivo-s1-pro-shortcut-center'

# Global permissions needed for Release and GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-release'
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------
  # 1. VALIDATION & INTEGRITY CHECK
  # -----------------------------------------------------------
  validate:
    name: Lint & Code Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Core UI Files
        run: |
          echo "Checking required files..."
          if [ ! -f "index.html" ]; then
            echo "::error file=index.html::index.html is missing!"
            exit 1
          fi
          echo "index.html detected successfully."

      - name: Validate HTML Syntax
        run: |
          # Basic syntax / tag completeness check
          grep -q "<!DOCTYPE html>" index.html || (echo "Missing DOCTYPE" && exit 1)
          grep -q "shortcut-center" index.html || (echo "Missing shortcut-center root container" && exit 1)
          echo "Validation passed."

  # -----------------------------------------------------------
  # 2. BUILD & PACKAGE ARTIFACTS (v0.9)
  # -----------------------------------------------------------
  build:
    name: Build & Package (v${{ github.event.inputs.version || '0.9' }})
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: set_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ env.DEFAULT_VERSION }}"
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "RESOLVED_VERSION=${VER}" >> $GITHUB_ENV

      - name: Compile Distribution Folder
        run: |
          mkdir -p dist
          # Copy frontend assets to output bundle
          cp index.html dist/
          [ -d "assets" ] && cp -r assets dist/ || true
          [ -d "css" ] && cp -r css dist/ || true
          [ -d "js" ] && cp -r js dist/ || true

      - name: Archive Production Zip
        run: |
          cd dist
          zip -r "../${{ env.APP_NAME }}-v${{ env.RESOLVED_VERSION }}.zip" ./*
          cd ..

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-v${{ env.RESOLVED_VERSION }}
          path: ${{ env.APP_NAME }}-v${{ env.RESOLVED_VERSION }}.zip
          retention-days: 30

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  # -----------------------------------------------------------
  # 3. DEPLOY LIVE DEMO TO GITHUB PAGES
  # -----------------------------------------------------------
  deploy-pages:
    name: Deploy Live Preview
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -----------------------------------------------------------
  # 4. GITHUB RELEASE CREATION
  # -----------------------------------------------------------
  release:
    name: Publish Release (v${{ needs.build.outputs.version }})
    needs: build
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == true)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Zip
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-v${{ needs.build.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build.outputs.version }}"
          name: "Release v${{ needs.build.outputs.version }} - Vivo S1 Pro Shortcut Center"
          draft: false
          prerelease: false
          files: "${{ env.APP_NAME }}-v${{ needs.build.outputs.version }}.zip"
          body: |
            ### Vivo S1 Pro Shortcut Center (v${{ needs.build.outputs.version }})
            
            #### Updates & Changelog:
            - **Full Screen Edge Reach:** Slider bars and icon tiles reach 100% of horizontal screen boundaries.
            - **Compact Header Height:** Matches original Funtouch OS 9.2 proportions (no oversized gap at the top).
            - **Tile Sizing:** Exact 4-column balanced layout with circular icon frames and typography.
            - **Vivo Accent Styling:** Authentic Electric Blue active indicator glow.
