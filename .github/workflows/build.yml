          # 16. CustomTilesActivity.kt
          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/CustomTilesActivity.kt
          package com.vivo.funtouch.shortcutcenter
          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView

          class CustomTilesActivity : AppCompatActivity() {
              companion object {
                  var allTiles: ArrayList<ShortcutTile> = TileRegistry.getDefaultTiles()
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_custom)
                  val rvActive = findViewById<RecyclerView>(R.id.rvCustomActive)
                  val rvAvailable = findViewById<RecyclerView>(R.id.rvCustomAvailable)
                  val activeList = allTiles.filter { it.isDisplayed }.toMutableList()
                  val availableList = allTiles.filter { !it.isDisplayed }.toMutableList()

                  val activeAdapter = TileAdapter(activeList, { tile, pos ->
                      tile.isDisplayed = false
                      activeList.removeAt(pos)
                      availableList.add(tile)
                      rvActive.adapter?.notifyDataSetChanged()
                      rvAvailable.adapter?.notifyDataSetChanged()
                  })
                  val availableAdapter = TileAdapter(availableList, { tile, pos ->
                      tile.isDisplayed = true
                      availableList.removeAt(pos)
                      activeList.add(tile)
                      activeAdapter.notifyDataSetChanged()
                      rvAvailable.adapter?.notifyDataSetChanged()
                  })
                  rvActive.layoutManager = GridLayoutManager(this, 3)
                  rvActive.adapter = activeAdapter
                  rvAvailable.layoutManager = GridLayoutManager(this, 2)
                  rvAvailable.adapter = availableAdapter
                  findViewById<TextView>(R.id.btnDone).setOnClickListener { finish() }
              }
          }
          EOF

          # 17. VivoOverlayService.kt
          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/VivoOverlayService.kt
          package com.vivo.funtouch.shortcutcenter
          import android.annotation.SuppressLint
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.IBinder
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.CalendarContract
          import android.provider.Settings
          import android.view.*
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView

          class VivoOverlayService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var triggerView: View
              private lateinit var panelView: View
              private lateinit var vibrator: Vibrator
              private var isPanelOpen = false
              private var isTorchOn = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator

                  startVivoForegroundService()
                  setupBottomTrigger()
                  setupVivoPanel()
              }

              private fun startVivoForegroundService() {
                  val channelId = "vivo_shortcut_center_bg"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "Vivo Shortcut Center Background Service",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(channel)
                  }

                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Shortcut Center")
                      .setContentText("Active in background")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setOngoing(true)
                      .build()

                  startForeground(1001, notification)
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupBottomTrigger() {
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      60,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.BOTTOM }

                  triggerView = View(this)
                  var startY = 0f
                  triggerView.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> { startY = event.rawY; true }
                          MotionEvent.ACTION_MOVE -> {
                              if (startY - event.rawY > 22 && !isPanelOpen) {
                                  vibrateClick()
                                  showPanel()
                              }
                              true
                          }
                          else -> false
                      }
                  }
                  wm.addView(triggerView, params)
              }

              private fun setupVivoPanel() {
                  panelView = LayoutInflater.from(this).inflate(R.layout.layout_vivo_shortcut_center, null)
                  val brightness = panelView.findViewById<VivoVerticalSlider>(R.id.sliderBrightness)
                  val volume = panelView.findViewById<VivoVerticalSlider>(R.id.sliderVolume)
                  val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val rvTiles = panelView.findViewById<RecyclerView>(R.id.rvActiveTiles)

                  volume.isVolume = true

                  volume.onProgressChanged = { pct ->
                      val max = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                      audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, (pct * max).toInt(), 0)
                  }

                  brightness.onProgressChanged = { pct ->
                      if (Settings.System.canWrite(this)) {
                          Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS, (pct * 255).toInt())
                      }
                  }

                  val activeTiles = CustomTilesActivity.allTiles.filter { it.isDisplayed }.toMutableList()
                  val adapter = TileAdapter(
                      tiles = activeTiles,
                      onTileClick = { tile, pos ->
                          vibrateClick()
                          handleTileClick(tile)
                          tile.isActive = !tile.isActive
                          rvTiles.adapter?.notifyItemChanged(pos)
                      },
                      onTileLongClick = { tile, _ ->
                          vibrateClick()
                          openSpecificSetting(tile.id)
                      }
                  )
                  rvTiles.layoutManager = GridLayoutManager(this, 3)
                  rvTiles.adapter = adapter

                  panelView.findViewById<View>(R.id.cardCalendar).setOnClickListener {
                      launchIntent(Intent(Intent.ACTION_VIEW).setData(CalendarContract.CONTENT_URI))
                  }
                  panelView.findViewById<View>(R.id.cardFiles).setOnClickListener {
                      launchIntent(Intent(Intent.ACTION_GET_CONTENT).setType("*/*"))
                  }
                  panelView.findViewById<View>(R.id.cardHome).setOnClickListener {
                      launchIntent(Intent(Intent.ACTION_VIEW, Uri.parse("geo:0,0?q=Home")))
                  }
                  panelView.findViewById<View>(R.id.cardTrending).setOnClickListener {
                      launchIntent(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/feed/trending")))
                  }

                  panelView.findViewById<View>(R.id.appYouTube).setOnClickListener { launchPackage("com.google.android.youtube") }
                  panelView.findViewById<View>(R.id.appWhatsApp).setOnClickListener { launchPackage("com.whatsapp") }
                  panelView.findViewById<View>(R.id.appChrome).setOnClickListener { launchPackage("com.android.chrome") }
                  panelView.findViewById<View>(R.id.appCamera).setOnClickListener { launchIntent(Intent("android.media.action.STILL_IMAGE_CAMERA")) }

                  panelView.findViewById<View>(R.id.btnClose).setOnClickListener { vibrateClick(); hidePanel() }
                  panelView.findViewById<View>(R.id.btnCollapse).setOnClickListener { vibrateClick(); hidePanel() }
                  panelView.findViewById<View>(R.id.btnCustomTiles).setOnClickListener {
                      vibrateClick()
                      hidePanel()
                      startActivity(Intent(this, CustomTilesActivity::class.java).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                  }
                  panelView.findViewById<View>(R.id.btnSystemSettings).setOnClickListener {
                      vibrateClick()
                      hidePanel()
                      startActivity(Intent(Settings.ACTION_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                  }
                  panelView.findViewById<View>(R.id.panelOverlayRoot).setOnClickListener { hidePanel() }
              }

              private fun launchPackage(packageName: String) {
                  hidePanel()
                  val intent = packageManager.getLaunchIntentForPackage(packageName)
                  if (intent != null) {
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(intent)
                  }
              }

              private fun launchIntent(intent: Intent) {
                  hidePanel()
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  try { startActivity(intent) } catch (e: Exception) {}
              }

              private fun handleTileClick(tile: ShortcutTile) {
                  when (tile.id) {
                      "torch" -> {
                          try {
                              val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                              isTorchOn = !isTorchOn
                              cm.setTorchMode(cm.cameraIdList[0], isTorchOn)
                          } catch (e: Exception) {}
                      }
                      "wifi" -> startActivity(Intent(Settings.ACTION_WIFI_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                      "bluetooth" -> startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                      "data" -> startActivity(Intent(Settings.ACTION_DATA_ROAMING_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                      "dark", "eye" -> startActivity(Intent(Settings.ACTION_DISPLAY_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                      "vibrate" -> {
                          val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          am.ringerMode = if (am.ringerMode == AudioManager.RINGER_MODE_VIBRATE) AudioManager.RINGER_MODE_NORMAL else AudioManager.RINGER_MODE_VIBRATE
                      }
                  }
              }

              private fun openSpecificSetting(tileId: String) {
                  hidePanel()
                  val intent = when (tileId) {
                      "wifi" -> Intent(Settings.ACTION_WIFI_SETTINGS)
                      "bluetooth" -> Intent(Settings.ACTION_BLUETOOTH_SETTINGS)
                      "data" -> Intent(Settings.ACTION_DATA_ROAMING_SETTINGS)
                      "dark", "eye" -> Intent(Settings.ACTION_DISPLAY_SETTINGS)
                      "vibrate" -> Intent(Settings.ACTION_SOUND_SETTINGS)
                      else -> Intent(Settings.ACTION_SETTINGS)
                  }
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  try { startActivity(intent) } catch (e: Exception) {}
              }

              private fun vibrateClick() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      vibrator.vibrate(VibrationEffect.createPredefined(VibrationEffect.EFFECT_CLICK))
                  }
              }

              private fun showPanel() {
                  if (isPanelOpen) return
                  setupVivoPanel()
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  wm.addView(panelView, params)
                  isPanelOpen = true

                  panelView.translationY = 1200f
                  panelView.animate().translationY(0f).setDuration(220).start()
              }

              private fun hidePanel() {
                  if (!isPanelOpen) return
                  panelView.animate().translationY(1200f).setDuration(180).withEndAction {
                      try { wm.removeView(panelView) } catch (e: Exception) {}
                      isPanelOpen = false
                  }.start()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::triggerView.isInitialized) wm.removeView(triggerView)
                  if (isPanelOpen) wm.removeView(panelView)
              }
          }
          EOF

          # 18. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/vivo/funtouch/shortcutcenter/MainActivity.kt
          package com.vivo.funtouch.shortcutcenter
          import android.content.ComponentName
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(50, 70, 50, 50)
                  }

                  val title = TextView(this).apply {
                      text = "Vivo Shortcut Center (Auto Boot)"
                      textSize = 20f
                      setPadding(0, 0, 0, 30)
                  }
                  layout.addView(title)

                  val btnOverlay = Button(this).apply {
                      text = "1. Enable Floating Overlay"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))) }
                  }
                  layout.addView(btnOverlay)

                  val btnWrite = Button(this).apply {
                      text = "2. Enable Brightness Permission"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:$packageName"))) }
                  }
                  layout.addView(btnWrite)

                  val btnBattery = Button(this).apply {
                      text = "3. Disable Battery Restrictions"
                      setOnClickListener {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              val pm = getSystemService(PowerManager::class.java)
                              if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                                  startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                      data = Uri.parse("package:$packageName")
                                  })
                              } else {
                                  Toast.makeText(this@MainActivity, "Battery whitelist already enabled!", Toast.LENGTH_SHORT).show()
                              }
                          }
                      }
                  }
                  layout.addView(btnBattery)

                  val btnVivoSettings = Button(this).apply {
                      text = "4. Enable Vivo Autostart (Required for Boot)"
                      setOnClickListener {
                          openVivoAutostart()
                      }
                  }
                  layout.addView(btnVivoSettings)

                  val btnStart = Button(this).apply {
                      text = "5. Launch Shortcut Center"
                      setOnClickListener {
                          if (Settings.canDrawOverlays(this@MainActivity)) {
                              val serviceIntent = Intent(this@MainActivity, VivoOverlayService::class.java)
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  startForegroundService(serviceIntent)
                              } else {
                                  startService(serviceIntent)
                              }
                              Toast.makeText(this@MainActivity, "Active! Starts automatically on boot", Toast.LENGTH_LONG).show()
                          } else {
                              Toast.makeText(this@MainActivity, "Please grant Floating Overlay first", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
                  layout.addView(btnStart)

                  setContentView(layout)
              }

              private fun openVivoAutostart() {
                  val intents = arrayOf(
                      Intent().setComponent(ComponentName("com.vivo.permissionmanager", "com.vivo.permissionmanager.activity.BgStartUpManagerActivity")),
                      Intent().setComponent(ComponentName("com.iqoo.secure", "com.iqoo.secure.ui.phoneoptimize.AddWhiteListActivity")),
                      Intent().setComponent(ComponentName("com.iqoo.secure", "com.iqoo.secure.MainGuideActivity")),
                      Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).setData(Uri.parse("package:$packageName"))
                  )
                  for (intent in intents) {
                      try {
                          startActivity(intent)
                          return
                      } catch (e: Exception) {}
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Collect and Rename APK
        run: |
          mkdir -p apk_output
          find . -name "*.apk" -exec cp {} apk_output/VivoControlCenter.apk \;
          ls -lh apk_output/

      - name: Export APK File
        uses: actions/upload-artifact@v4
        with:
          name: Vivo-Control-Center-APK
          path: apk_output/VivoControlCenter.apk
          if-no-files-found: error

      - name: Publish Direct Release Download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v5.0 --yes || true
          git tag -d v5.0 || true
          gh release create v5.0 apk_output/VivoControlCenter.apk --title "Vivo Control Center v5.0 (Auto-Start on Boot)" --notes "Starts automatically whenever phone powers on or restarts" || true
